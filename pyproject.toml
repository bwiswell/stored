[project]
name = "stored"
version = "0.1.0"
description = "A seared-flavored persistence layer and Zenoh chronicler"
authors = [
    { name = "Benj Wiswell", email = "benjwiswell@gmail.com" },
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "seared>=0.2.1",
    "duckdb>=1.1",
]

[project.optional-dependencies]
# The Zenoh chronicler layer (``stored.zenoh``). Optional so the core stays
# transport-free: every zeared class is a seared class, so persistence never
# needs zeared. ``eclipse-zenoh`` / ``msgpack`` arrive transitively via zeared.
zenoh = ["zeared>=0.2.4"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24",
    "ty",
    "ruff",
    "deptry",
]

[tool.uv.sources]
# House convention: cross-repo deps via git sources (kept as plain version
# specs above so hatchling sees no direct reference). For local co-development
# against the workspace clones, override with e.g.
#   seared = { path = "../seared", editable = true }
seared = { git = "https://github.com/bwiswell/seared" }
zeared = { git = "https://github.com/bwiswell/zeared" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stored"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
asyncio_mode = "auto"

[tool.ty.src]
# ty checks all source modules; tests build instances via **kwargs / .load(dict)
# that ty can't introspect, so only they are excluded.
exclude = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
    "D107",  # __init__ docstring — google convention documents args on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.deptry.per_rule_ignores]
# ``zeared`` is an optional-extra dep used only by the guarded ``stored.zenoh``
# layer; ``pytest``/``pytest-asyncio`` are dev-only test deps.
DEP001 = ["zeared"]
