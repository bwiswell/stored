[project]
name = "stored"
version = "0.3.0"
description = "A zeared-native persistence layer and Zenoh chronicler"
authors = [
    { name = "Benj Wiswell", email = "benjwiswell@gmail.com" },
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "seared>=0.2.1",
    # zeared is a core dependency: stored is a zeared-native chronicler (plan
    # 02). Every real consumer is a mesh service that already carries zeared, so
    # hiding it behind an extra guarded a consumer-less install. ``eclipse-zenoh``
    # / ``msgpack`` arrive transitively. The seared-only *core* still imports no
    # zeared at runtime (the top-level ``Chronicler`` re-export is lazy), so a
    # Store-only ``import stored`` stays transport-free at import time.
    "zeared>=0.3.5",
]

[project.optional-dependencies]
# ``stored[zenoh]`` is gone as of 0.3.0. The Zenoh chronicler ships with the base
# install (``zeared`` is a core dependency), and the empty alias that kept old install
# strings resolving has served its release.

# The DuckDB backend — an optional upgrade for analytical/aggregation queries. The
# default is stdlib ``sqlite3``, so the core install stays lean: the dependency worth
# making optional is the columnar engine, never the transport.
duckdb = ["duckdb>=1.1"]

[dependency-groups]
dev = [
    "deptry",
    "prek",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24",
    "ruff",
    "ty",
]

[tool.uv.sources]
# House convention: cross-repo deps via git sources (kept as plain version
# specs above so hatchling sees no direct reference). For local co-development
# against the workspace clones, override with e.g.
#   seared = { path = "../seared", editable = true }
seared = { git = "https://github.com/bwiswell/seared" }
zeared = { git = "https://github.com/bwiswell/zeared" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stored"]

[tool.hatch.build.targets.sdist]
exclude = ["/bench", "/project-plans"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
asyncio_mode = "auto"

[tool.ty.src]
# ty checks all source modules; tests build instances via **kwargs / .load(dict)
# that ty can't introspect, and bench/ is a throwaway script — both excluded.
exclude = ["tests", "bench"]

[tool.ruff]
line-length = 120
target-version = "py314"
indent-width = 4
# Ruff formats Python code blocks inside Markdown. Off here, as in seared/zeared: the
# docs align field declarations into columns deliberately, and several ```python blocks
# show *JSON* wire form, which the formatter rewrites to single quotes.
extend-exclude = ["bench", "*.md"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM",     # comma rules (formatter owns these)
    "CPY",     # copyright notice at top of file
    "FLY",     # str.join -> f-string (we join to avoid the {{}} brace footgun)
    "D100",    # missing docstring in public module
    "D101",    # missing docstring in public class
    "D104",    # missing docstring in public package
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-summary-second-line (conflicts with D212)
    "D107",    # __init__ docstring — google convention documents args on the class
    "PLC0415", # allow intentional lazy imports
    "TD",      # TODO formatting
    "FIX002",  # disallow TODOs
    "TRY003",  # long messages outside exception class
    # --- stored-specific deviations from the house list ---
    # Everything stored and queried is **naive UTC** by design (docs/architecture.md
    # "Time"): canonicalizing at the boundary keeps storage dependency-free across
    # backends, and SQLite orders ISO-8601 text lexically only if it is uniform. The
    # naive constructor calls are that decision, not an oversight.
    "DTZ001",  # datetime() without tzinfo
    # stored is four Pattern B subpackages (backends/, mesh/, zenoh/, plus the core)
    # whose modules reach their siblings via `from ..x import` — the same layout
    # zeared carries this ignore for.
    "TID252",  # parent-relative imports are the subpackage layout working
    # `Any` is the boundary type here as in the sisters: backend rows, zeared payloads,
    # and the `meta` surface a subscriber hands in.
    "ANN401",  # dynamically typed expressions at the boundary
    # A read *is* its dimensions: key, window, order, limit, chunk, filters, paths — and
    # a registration is its spec. They are keyword-only, so the count is a description of
    # the query language rather than a function doing too much. Fifteen `noqa`s down the
    # read surface would say less than this comment does.
    "PLR0913", # too many arguments
    "PLR0917", # too many positional arguments
]
fixable = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.per-file-ignores]
# The transport layer imports its transport at runtime, on purpose. `zeared` appears
# only in annotations here, so TC would make the import type-only and technically be
# right — but importing `stored.zenoh` is *how* a consumer opts into the transport, an
# invariant `tests/test_dependency_shape.py` pins. Hiding it would make the layer's
# whole reason for existing invisible at import time.
"stored/zenoh/**" = ["TC002"]

# Tests assert, build fixtures without annotations, reach into privates to prove
# internals (page counts, plan shapes), and compare against magic numbers on purpose.
"tests/**" = [
    "ANN",     # fixtures and test functions carry no annotations
    "ARG",     # unused arguments in stub callbacks
    "D",       # docstrings are optional in tests
    "INP001",  # test packages are namespace dirs by design
    "PLR2004", # magic values are the assertions
    "PT011",   # broad pytest.raises is fine against our own error types
    "S101",    # assert is the point
    "S603",    # subprocess in the dependency-shape probes
    "SLF001",  # reaching into privates is how invariants get pinned
]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
quote-style = "single"

[tool.deptry]
extend_exclude = ["bench"]

[tool.deptry.per_rule_ignores]
# ``duckdb`` (the optional DuckDB backend) is an optional-extra dep imported only
# behind a lazy guard. ``zeared`` is now a declared core dependency, so it no
# longer needs a DEP001 ignore.
DEP001 = ["duckdb"]
